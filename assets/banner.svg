<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.8" opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      .anim-glow-cyan {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 250px 200px;
      }
      .anim-glow-purple {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 950px 220px;
      }
      .anim-float-1 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatReverse 9s ease-in-out infinite;
      }
      .dash-line {
        stroke-dasharray: 8, 8;
        animation: dashMove 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Glows (Behind all content) -->
  <circle class="anim-glow-cyan" cx="250" cy="200" r="280" fill="url(#glowCyan)" />
  <circle class="anim-glow-purple" cx="950" cy="220" r="280" fill="url(#glowPurple)" />

  <!-- Decorative Orbit Lines & Flow Nodes (Dynamic background element) -->
  <g opacity="0.35">
    <path class="dash-line" d="M 100 80 Q 600 -30 1100 80" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <path class="dash-line" d="M 80 340 Q 600 450 1120 340" fill="none" stroke="#a855f7" stroke-width="1.5" />
    
    <!-- Floating Micro-Sandboxes Icons (Decorative in corners) -->
    <g class="anim-float-1" transform="translate(110, 80)">
      <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
      <text x="0" y="8" fill="#38bdf8" font-size="24" text-anchor="middle" font-family="system-ui, sans-serif">⚡</text>
    </g>
    <g class="anim-float-2" transform="translate(1080, 90)">
      <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="0" y="8" fill="#c084fc" font-size="24" text-anchor="middle" font-family="system-ui, sans-serif">📦</text>
    </g>
    <g class="anim-float-2" transform="translate(130, 330)">
      <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />
      <text x="0" y="8" fill="#60a5fa" font-size="24" text-anchor="middle" font-family="system-ui, sans-serif">🛡️</text>
    </g>
    <g class="anim-float-1" transform="translate(1070, 320)">
      <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="8" fill="#34d399" font-size="24" text-anchor="middle" font-family="system-ui, sans-serif">🌐</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Clear & Legible -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="0" y="5" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">AWESOME ISOLATED SANDBOXES</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 160)">
    <text x="0" y="0" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">Isolated Test Sandboxes</text>
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Isolated Test Sandboxes</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 210)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
      Ephemeral Environments • MicroVMs • Cloud Emulators • PR Previews • Wasm Runtimes
    </text>
  </g>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 280)">
    <!-- Pill 1 -->
    <g transform="translate(-375, 0)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" opacity="0.95" />
      <text x="85" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Ephemeral Staging</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
      <text x="85" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ Cloud Emulation</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(-5, 0)">
      <rect x="0" y="0" width="175" height="38" rx="19" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" />
      <text x="87" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Firecracker &amp; MicroVM</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="185" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
      <text x="92" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 WebContainers &amp; Wasm</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="250" y="380" width="700" height="3" rx="1.5" fill="url(#cyanPurpleGrad)" />
</svg>
